<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c130c"/>
      <stop offset="50%" stop-color="#2c1a10"/>
      <stop offset="100%" stop-color="#140c07"/>
    </linearGradient>

    <!-- Warm Glow -->
    <radialGradient id="hearthGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cold Coffee Gradient -->
    <linearGradient id="coffeeBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d2112"/>
      <stop offset="35%" stop-color="#6e3e1e"/>
      <stop offset="70%" stop-color="#93572d"/>
      <stop offset="100%" stop-color="#3d2112"/>
    </linearGradient>

    <!-- Cream Foam -->
    <linearGradient id="creamFoam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fdf3e7"/>
      <stop offset="100%" stop-color="#e8cfb0"/>
    </linearGradient>

    <!-- Mojito / Cooler Gradient -->
    <linearGradient id="mojitoBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glassReflect" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Dark Cafe Table Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#hearthGlow)"/>

  <!-- Bokeh Ambient Dots -->
  <circle cx="140" cy="180" r="30" fill="#f59e0b" opacity="0.12"/>
  <circle cx="220" cy="110" r="45" fill="#f97316" opacity="0.08"/>
  <circle cx="680" cy="160" r="40" fill="#10b981" opacity="0.12"/>
  <circle cx="600" cy="90" r="25" fill="#f59e0b" opacity="0.1"/>

  <!-- Rustic Wooden Table Base -->
  <path d="M0 450 L800 450 L800 600 L0 600 Z" fill="#170f09"/>
  <path d="M0 450 L800 450" stroke="#3d2617" stroke-width="6"/>

  <!-- DRINK 1: Tall Artisan Cold Coffee (Left Center) -->
  <g transform="translate(180, 70)">
    <!-- Straw -->
    <line x1="165" y1="50" x2="205" y2="-30" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
    <line x1="167" y1="45" x2="203" y2="-27" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

    <!-- Coffee Glass Silhouette -->
    <path d="M90 120 L210 120 L195 440 L105 440 Z" fill="url(#coffeeBody)" rx="8"/>

    <!-- Chocolate Swirls inside -->
    <path d="M100 170 Q150 210 120 280 T180 370" stroke="#241208" stroke-width="14" fill="none" opacity="0.8" stroke-linecap="round"/>
    <path d="M190 190 Q140 250 175 320" stroke="#241208" stroke-width="10" fill="none" opacity="0.7" stroke-linecap="round"/>

    <!-- Ice Cubes inside Coffee -->
    <rect x="115" y="180" width="45" height="40" rx="6" fill="#fff" opacity="0.18" transform="rotate(12 135 200)"/>
    <rect x="145" y="240" width="40" height="42" rx="6" fill="#fff" opacity="0.18" transform="rotate(-15 165 260)"/>

    <!-- Whipped Cream Foam Head -->
    <ellipse cx="150" cy="120" rx="62" ry="24" fill="url(#creamFoam)"/>
    <path d="M100 120 Q120 80 150 75 Q180 80 200 120 Z" fill="url(#creamFoam)"/>
    <ellipse cx="150" cy="76" rx="28" ry="14" fill="#ffffff"/>
    <!-- Chocolate Drizzle on Top -->
    <path d="M125 105 Q145 90 165 110 T185 98" stroke="#3e1d0c" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Glass Highlights & Specular Reflection -->
    <path d="M90 120 L210 120 L195 440 L105 440 Z" fill="url(#glassReflect)"/>
    <!-- Vertical Bright Glass Reflection Strip -->
    <path d="M105 130 L115 430" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <path d="M195 130 L188 430" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

    <!-- Glass Heavy Base -->
    <rect x="98" y="440" width="104" height="20" rx="6" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="150" cy="455" rx="55" ry="10" fill="#000000" opacity="0.45"/>
  </g>

  <!-- DRINK 2: Refreshing Lime Mint Mojito Cooler (Right Center) -->
  <g transform="translate(430, 110)">
    <!-- Glass Straw -->
    <line x1="145" y1="40" x2="115" y2="-20" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <line x1="143" y1="36" x2="117" y2="-18" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>

    <!-- Tumbler Glass Silhouette -->
    <path d="M80 80 L190 80 L180 400 L90 400 Z" fill="url(#mojitoBody)"/>

    <!-- Fresh Mint Leaves inside -->
    <path d="M105 180 C90 160 110 140 130 155 C125 175 115 185 105 180 Z" fill="#064e3b"/>
    <path d="M150 260 C135 240 155 220 175 235 C170 255 160 265 150 260 Z" fill="#064e3b"/>
    <path d="M110 320 C95 300 115 285 135 300 C130 318 120 325 110 320 Z" fill="#064e3b"/>

    <!-- Floating Ice Cubes -->
    <rect x="110" y="110" width="42" height="42" rx="6" fill="#ffffff" opacity="0.3" transform="rotate(8 130 130)"/>
    <rect x="125" y="190" width="40" height="40" rx="6" fill="#ffffff" opacity="0.25" transform="rotate(-12 145 210)"/>
    <rect x="105" y="270" width="38" height="38" rx="6" fill="#ffffff" opacity="0.25" transform="rotate(18 125 290)"/>

    <!-- Fizz Effervescence Bubbles -->
    <circle cx="100" cy="240" r="4" fill="#ffffff" opacity="0.5"/>
    <circle cx="165" cy="210" r="5" fill="#ffffff" opacity="0.6"/>
    <circle cx="120" cy="350" r="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="150" cy="320" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="135" cy="150" r="3" fill="#ffffff" opacity="0.7"/>

    <!-- Fresh Lemon Slice Perched on Glass Rim -->
    <g transform="translate(68, 65)">
      <circle cx="20" cy="20" r="32" fill="#fbbf24"/>
      <circle cx="20" cy="20" r="27" fill="#fef08a"/>
      <!-- Lemon pulp segments -->
      <path d="M20 20 L10 5 A22 22 0 0 1 30 5 Z" fill="#facc15"/>
      <path d="M20 20 L32 10 A22 22 0 0 1 38 24 Z" fill="#facc15"/>
      <path d="M20 20 L35 28 A22 22 0 0 1 24 39 Z" fill="#facc15"/>
      <path d="M20 20 L16 39 A22 22 0 0 1 5 28 Z" fill="#facc15"/>
      <path d="M20 20 L4 22 A22 22 0 0 1 8 10 Z" fill="#facc15"/>
    </g>

    <!-- Glass Specular Reflection -->
    <path d="M80 80 L190 80 L180 400 L90 400 Z" fill="url(#glassReflect)"/>
    <path d="M92 90 L98 390" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    <path d="M178 90 L172 390" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Glass Heavy Base -->
    <rect x="85" y="400" width="100" height="18" rx="6" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="135" cy="415" rx="52" ry="9" fill="#000000" opacity="0.45"/>
  </g>

  <!-- Badge / Label Pill in Center Foreground -->
  <g transform="translate(280, 485)">
    <rect width="240" height="46" rx="23" fill="#1c1109" stroke="#f59e0b" stroke-width="2" opacity="0.95"/>
    <text x="120" y="28" font-family="sans-serif" font-size="14" font-weight="900" fill="#fde68a" text-anchor="middle" letter-spacing="2">
      ★ CAFE BEVERAGES ★
    </text>
  </g>
</svg>
