<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a170d" />
      <stop offset="65%" stop-color="#190e08" />
      <stop offset="100%" stop-color="#0f0804" />
    </radialGradient>

    <!-- Ring Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Flame Core Gradient -->
    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Inner Hot Flame -->
    <linearGradient id="innerFlame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Crust Golden Gradient -->
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Ambient Fire Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shadow & Base Circle -->
  <circle cx="120" cy="120" r="114" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="4" />
  <circle cx="120" cy="120" r="106" stroke="url(#goldBorder)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Wood-Fired Oven Arch (Brick Hearth) -->
  <path d="M56 160 A 64 64 0 0 1 184 160 Z" fill="#26140a" stroke="url(#goldBorder)" stroke-width="3" />
  <path d="M64 160 A 56 56 0 0 1 176 160 Z" fill="#150b05" />

  <!-- Fire Hearth Floor / Pizza Stone Deck -->
  <rect x="50" y="158" width="140" height="10" rx="5" fill="url(#crustGrad)" />

  <!-- Sourdough Pizza Base / Rising Crust Arch -->
  <path d="M72 156 Q 120 126 168 156 Q 120 142 72 156 Z" fill="url(#crustGrad)" />

  <!-- Dancing Wood Fire Flame (Back Glow) -->
  <path d="M120 72 C 108 92 98 108 98 126 C 98 144 108 154 120 154 C 132 154 142 144 142 126 C 142 108 132 92 120 72 Z" fill="#ea580c" opacity="0.4" filter="url(#glow)" />

  <!-- Main Flame -->
  <path d="M120 68 C 104 90 94 110 94 128 C 94 146 106 156 120 156 C 134 156 146 146 146 128 C 146 110 136 90 120 68 Z" fill="url(#flameGrad)" />

  <!-- Inner Dynamic Flame Tongue -->
  <path d="M120 94 C 112 108 106 120 106 132 C 106 144 112 152 120 152 C 128 152 134 144 134 132 C 134 120 128 108 120 94 Z" fill="url(#innerFlame)" />

  <!-- Hot White Core Spark -->
  <path d="M120 120 C 116 128 114 136 114 142 C 114 148 117 151 120 151 C 123 151 126 148 126 142 C 126 136 124 128 120 120 Z" fill="#ffffff" />

  <!-- Wheat Ears / Artisan Stalks (Left) -->
  <g fill="url(#goldBorder)" opacity="0.85">
    <ellipse cx="44" cy="116" rx="4" ry="9" transform="rotate(-30 44 116)" />
    <ellipse cx="40" cy="132" rx="4" ry="9" transform="rotate(-20 40 132)" />
    <ellipse cx="40" cy="148" rx="4" ry="9" transform="rotate(-10 40 148)" />
    <path d="M42 106 Q 40 136 46 166" stroke="url(#goldBorder)" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Wheat Ears / Artisan Stalks (Right) -->
  <g fill="url(#goldBorder)" opacity="0.85">
    <ellipse cx="196" cy="116" rx="4" ry="9" transform="rotate(30 196 116)" />
    <ellipse cx="200" cy="132" rx="4" ry="9" transform="rotate(20 200 132)" />
    <ellipse cx="200" cy="148" rx="4" ry="9" transform="rotate(10 200 148)" />
    <path d="M198 106 Q 200 136 194 166" stroke="url(#goldBorder)" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Text Top Arc: "THE CRUST CULTURE" -->
  <path id="topTextArc" d="M 38 120 A 82 82 0 0 1 202 120" fill="none" />
  <text font-family="'Inter', 'Montserrat', 'Georgia', sans-serif" font-size="13.5" font-weight="900" fill="#fef3c7" letter-spacing="3.2">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      THE CRUST CULTURE
    </textPath>
  </text>

  <!-- Text Bottom Arc: "WOOD FIRED KITCHEN" -->
  <path id="bottomTextArc" d="M 202 126 A 82 82 0 0 1 38 126" fill="none" />
  <text font-family="'Inter', 'Montserrat', sans-serif" font-size="10" font-weight="800" fill="#f59e0b" letter-spacing="2.8">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ★ WOOD FIRED KITCHEN ★
    </textPath>
  </text>

  <!-- Star Accents -->
  <circle cx="120" cy="46" r="2.5" fill="#fde047" />
  <circle cx="108" cy="48" r="1.5" fill="#f59e0b" />
  <circle cx="132" cy="48" r="1.5" fill="#f59e0b" />
</svg>
