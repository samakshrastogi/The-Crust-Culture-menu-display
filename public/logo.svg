<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Background Radial Gradient (Deep Roasted Hearth) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a140a" />
      <stop offset="65%" stop-color="#180b05" />
      <stop offset="100%" stop-color="#0c0502" />
    </radialGradient>

    <!-- Ring Border Gold Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Sourdough Crust Gradient -->
    <radialGradient id="crustGrad" cx="50%" cy="45%" r="55%">
      <stop offset="65%" stop-color="#fde68a" />
      <stop offset="82%" stop-color="#f59e0b" />
      <stop offset="93%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>

    <!-- Tomato Sauce Gradient -->
    <radialGradient id="sauceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Melted Mozzarella Cheese Gradient -->
    <radialGradient id="cheeseGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef9c3" />
      <stop offset="75%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </radialGradient>

    <!-- Wood Flame Outer Gradient -->
    <linearGradient id="flameOuter" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Wood Flame Core Gradient -->
    <linearGradient id="flameInner" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Basil Leaf Gradient -->
    <linearGradient id="basilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Paneer Cube Gradient -->
    <linearGradient id="paneerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <!-- Ambient Fire Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Pizza Wheel -->
    <filter id="pizzaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Outer Dark Emblem Circle -->
  <circle cx="120" cy="120" r="114" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="4" />
  <circle cx="120" cy="120" r="107" stroke="url(#goldBorder)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55" />

  <!-- Wood-Fired Oven Arch In Background -->
  <path d="M68 136 A 52 52 0 0 1 172 136 Z" fill="#1e0c05" stroke="url(#goldBorder)" stroke-width="2" opacity="0.8" />

  <!-- Background Wood-Fire Flame (Behind Pizza) -->
  <g filter="url(#glow)">
    <!-- Back Warm Aura -->
    <path d="M120 50 C 102 72 92 90 92 110 C 92 126 104 136 120 136 C 136 136 148 126 148 110 C 148 90 138 72 120 50 Z" fill="#ea580c" opacity="0.35" />
    <!-- Main Flame Body -->
    <path d="M120 46 C 104 70 94 92 94 112 C 94 128 106 136 120 136 C 134 136 146 128 146 112 C 146 92 136 70 120 46 Z" fill="url(#flameOuter)" />
    <!-- Center Tongue Flame -->
    <path d="M120 68 C 111 84 104 98 104 112 C 104 125 111 133 120 133 C 129 133 136 125 136 112 C 136 98 129 84 120 68 Z" fill="url(#flameInner)" />
    <!-- White Core Spark -->
    <path d="M120 90 C 116 99 113 107 113 116 C 113 122 116 126 120 126 C 124 126 127 122 127 116 C 127 107 124 99 120 90 Z" fill="#ffffff" />
  </g>

  <!-- Golden Wheat Ears / Stalks (Left) -->
  <g fill="url(#goldBorder)" opacity="0.85">
    <ellipse cx="44" cy="116" rx="3.5" ry="8" transform="rotate(-30 44 116)" />
    <ellipse cx="40" cy="132" rx="3.5" ry="8" transform="rotate(-20 40 132)" />
    <ellipse cx="40" cy="148" rx="3.5" ry="8" transform="rotate(-10 40 148)" />
    <path d="M42 106 Q 40 136 46 166" stroke="url(#goldBorder)" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>

  <!-- Golden Wheat Ears / Stalks (Right) -->
  <g fill="url(#goldBorder)" opacity="0.85">
    <ellipse cx="196" cy="116" rx="3.5" ry="8" transform="rotate(30 196 116)" />
    <ellipse cx="200" cy="132" rx="3.5" ry="8" transform="rotate(20 200 132)" />
    <ellipse cx="200" cy="148" rx="3.5" ry="8" transform="rotate(10 200 148)" />
    <path d="M198 106 Q 200 136 194 166" stroke="url(#goldBorder)" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>

  <!-- ==================================================== -->
  <!-- PIZZA CENTERPIECE (Wood-Fired Sourdough Pie) -->
  <!-- ==================================================== -->
  <g filter="url(#pizzaShadow)">
    <!-- 1. Puffy Cornicione Crust -->
    <circle cx="120" cy="132" r="46" fill="url(#crustGrad)" stroke="#78350f" stroke-width="1.5" />

    <!-- 2. Authentic Wood-Fired Leopard Char Spots along the Crust -->
    <!-- Top & Angles -->
    <ellipse cx="120" cy="88" rx="3.5" ry="2" fill="#381a06" opacity="0.85" />
    <circle cx="106" cy="91" r="2.2" fill="#451a03" opacity="0.9" />
    <circle cx="134" cy="91" r="2.5" fill="#381a06" opacity="0.9" />
    <ellipse cx="90" cy="104" rx="2.5" ry="4" transform="rotate(-35 90 104)" fill="#451a03" opacity="0.85" />
    <ellipse cx="150" cy="104" rx="2.5" ry="4" transform="rotate(35 150 104)" fill="#381a06" opacity="0.85" />
    <!-- Sides -->
    <ellipse cx="76" cy="128" rx="2.5" ry="4.5" transform="rotate(-15 76 128)" fill="#451a03" opacity="0.9" />
    <ellipse cx="164" cy="128" rx="2.5" ry="4.5" transform="rotate(15 164 128)" fill="#381a06" opacity="0.9" />
    <circle cx="78" cy="142" r="2.2" fill="#451a03" opacity="0.8" />
    <circle cx="162" cy="142" r="2.2" fill="#381a06" opacity="0.8" />
    <!-- Bottom Blisters -->
    <ellipse cx="94" cy="162" rx="3.5" ry="2.2" transform="rotate(20 94 162)" fill="#451a03" opacity="0.85" />
    <ellipse cx="146" cy="162" rx="3.5" ry="2.2" transform="rotate(-20 146 162)" fill="#381a06" opacity="0.85" />
    <circle cx="120" cy="176" r="2.8" fill="#451a03" opacity="0.9" />
    <circle cx="132" cy="174" r="1.8" fill="#381a06" opacity="0.8" />

    <!-- 3. San Marzano Rich Tomato Sauce Base -->
    <circle cx="120" cy="132" r="38" fill="url(#sauceGrad)" />

    <!-- 4. Melted Mozzarella & Fior di Latte Golden Cheese Pool -->
    <path d="M 120 96 
             C 136 96 154 108 154 124 
             C 154 130 156 136 154 142 
             C 151 152 144 162 134 166 
             C 124 170 112 168 104 162 
             C 94 154 88 142 88 130 
             C 88 114 102 96 120 96 Z" 
          fill="url(#cheeseGrad)" />

    <!-- Additional melted cheese patches overlapping sauce -->
    <ellipse cx="106" cy="116" rx="14" ry="10" transform="rotate(-15 106 116)" fill="url(#cheeseGrad)" opacity="0.95" />
    <ellipse cx="134" cy="118" rx="13" ry="9" transform="rotate(20 134 118)" fill="url(#cheeseGrad)" opacity="0.95" />
    <ellipse cx="122" cy="146" rx="16" ry="11" transform="rotate(5 122 146)" fill="url(#cheeseGrad)" opacity="0.95" />
    <ellipse cx="140" cy="138" rx="11" ry="8" transform="rotate(-10 140 138)" fill="url(#cheeseGrad)" opacity="0.95" />

    <!-- 5. Six Golden Pizza Slice Cut Lines (Subtle engraved crust cuts) -->
    <g stroke="#991b1b" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
      <!-- Top to Bottom -->
      <line x1="120" y1="94" x2="120" y2="170" />
      <!-- Top-Right to Bottom-Left (60 deg) -->
      <line x1="152" y1="113" x2="88" y2="151" />
      <!-- Top-Left to Bottom-Right (120 deg) -->
      <line x1="88" y1="113" x2="152" y2="151" />
    </g>

    <!-- 6. Gourmet Toppings -->
    <!-- Ripe Cherry Tomato Slices -->
    <g>
      <!-- Tomato 1 (Top Left) -->
      <circle cx="108" cy="112" r="5" fill="#dc2626" stroke="#b91c1c" stroke-width="0.8" />
      <circle cx="108" cy="112" r="3.2" fill="#ef4444" />
      <circle cx="106.8" cy="110.8" r="1" fill="#fef08a" opacity="0.9" />
      <circle cx="109.2" cy="113.2" r="0.9" fill="#fef08a" opacity="0.9" />

      <!-- Tomato 2 (Right) -->
      <circle cx="138" cy="126" r="5" fill="#dc2626" stroke="#b91c1c" stroke-width="0.8" />
      <circle cx="138" cy="126" r="3.2" fill="#ef4444" />
      <circle cx="136.8" cy="124.8" r="1" fill="#fef08a" opacity="0.9" />
      <circle cx="139.2" cy="127.2" r="0.9" fill="#fef08a" opacity="0.9" />

      <!-- Tomato 3 (Bottom) -->
      <circle cx="116" cy="154" r="5.2" fill="#dc2626" stroke="#b91c1c" stroke-width="0.8" />
      <circle cx="116" cy="154" r="3.4" fill="#ef4444" />
      <circle cx="114.8" cy="152.8" r="1" fill="#fef08a" opacity="0.9" />
      <circle cx="117.2" cy="155.2" r="0.9" fill="#fef08a" opacity="0.9" />
    </g>

    <!-- Golden Grilled Paneer / Mozzarella Cubes -->
    <g stroke="#d97706" stroke-width="0.6">
      <!-- Cube 1 (Top Right) -->
      <rect x="124" y="106" width="7" height="7" rx="1.5" fill="url(#paneerGrad)" transform="rotate(18 127 109)" />
      <!-- Cube 2 (Left Center) -->
      <rect x="94" y="128" width="7" height="7" rx="1.5" fill="url(#paneerGrad)" transform="rotate(-12 97 131)" />
      <!-- Cube 3 (Bottom Right) -->
      <rect x="131" y="144" width="7.5" height="7.5" rx="1.5" fill="url(#paneerGrad)" transform="rotate(25 134 147)" />
    </g>

    <!-- Fresh Vibrant Basil Leaves -->
    <!-- Basil 1 (Center-Left) -->
    <g transform="rotate(-28 116 128)">
      <path d="M116 120 C 111 123 108 128 116 136 C 124 128 121 123 116 120 Z" fill="url(#basilGrad)" />
      <path d="M116 122 L 116 134" stroke="#86efac" stroke-width="0.7" stroke-linecap="round" opacity="0.8" />
    </g>
    <!-- Basil 2 (Center-Right) -->
    <g transform="rotate(35 126 136)">
      <path d="M126 128 C 121 131 118 136 126 144 C 134 136 131 131 126 128 Z" fill="url(#basilGrad)" />
      <path d="M126 130 L 126 142" stroke="#86efac" stroke-width="0.7" stroke-linecap="round" opacity="0.8" />
    </g>
    <!-- Basil 3 (Top Center) -->
    <g transform="rotate(10 120 118)">
      <path d="M120 111 C 116 114 114 118 120 125 C 126 118 124 114 120 111 Z" fill="url(#basilGrad)" />
      <path d="M120 113 L 120 123" stroke="#86efac" stroke-width="0.6" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Olive / Char Herb Flecks -->
    <circle cx="127" cy="123" r="1.3" fill="#2e1405" opacity="0.8" />
    <circle cx="112" cy="140" r="1.2" fill="#2e1405" opacity="0.8" />
    <circle cx="122" cy="138" r="1" fill="#15803d" opacity="0.9" />
    <circle cx="134" cy="112" r="1.1" fill="#15803d" opacity="0.9" />
  </g>

  <!-- ==================================================== -->
  <!-- CIRCULAR BADGE TYPOGRAPHY (Top & Bottom Arcs)        -->
  <!-- ==================================================== -->

  <!-- Top Text Arc: "THE CRUST CULTURE" -->
  <path id="topTextArc" d="M 36 120 A 84 84 0 0 1 204 120" fill="none" />
  <text font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#fef3c7" letter-spacing="3.2">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      THE CRUST CULTURE
    </textPath>
  </text>

  <!-- Bottom Text Arc: "★ WOOD FIRED CAFE ★" -->
  <path id="bottomTextArc" d="M 204 126 A 84 84 0 0 1 36 126" fill="none" />
  <text font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#f59e0b" letter-spacing="3.2">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ★ WOOD FIRED CAFE ★
    </textPath>
  </text>

  <!-- Crest Star Accents at 12 O'Clock -->
  <circle cx="120" cy="38" r="2.5" fill="#fde047" />
  <circle cx="108" cy="40" r="1.6" fill="#f59e0b" />
  <circle cx="132" cy="40" r="1.6" fill="#f59e0b" />
</svg>
